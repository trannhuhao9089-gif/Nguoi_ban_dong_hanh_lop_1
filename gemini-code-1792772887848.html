<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Người Bạn Đồng Hành Lớp 1</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --bg-color: #f0f8ff;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 30px;
        }
        .mic-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .mic-btn:active {
            transform: scale(0.95);
        }
        .mic-btn.listening {
            background-color: #f44336;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(244, 67, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
        }
        #status-text {
            margin-top: 20px;
            font-weight: bold;
            color: #666;
        }
        #result-box {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            line-height: 1.6;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Trợ Lý Tiếng Việt 1</h1>
    <p class="subtitle">Bấm vào micro và nói tên bài học của con hôm nay</p>

    <button id="mic-btn" class="mic-btn">🎤</button>
    <div id="status-text">Sẵn sàng lắng nghe...</div>

    <div id="result-box"></div>

    <script>
        // CÔ HẢO LƯU Ý: ĐIỀN API KEY CỦA CÔ VÀO DÒNG BÊN DƯỚI
        const GEMINI_API_KEY = 'YOUR_GEMINI_API_KEY'; 
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status-text');
        const resultBox = document.getElementById('result-box');

        // Bản Hướng Dẫn (Prompt) đã được cấu hình riêng cho phụ huynh vùng đồng bào thiểu số
        const systemPrompt = `Bạn là Người Bạn Đồng Hành Lớp 1 (Tiếng Việt - KNTT). Bạn giúp phụ huynh vùng đồng bào thiểu số làm nương rẫy dạy con học nhẹ nhàng.
Quy tắc:
- Không giải thích dông dài. Đưa ra giải pháp bằng 3 bước hành động ngắn gọn (tối đa 10 phút).
- Ngôn từ bình dân, gần gũi. Gợi ý học qua đồ vật quen thuộc.
- Không dùng thuật ngữ sư phạm, không cho bài tập dài, không phán xét.
- Nếu có than phiền, đưa ra 2 câu kịch bản dỗ trẻ.`;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusText.innerText = "Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Vui lòng dùng Google Chrome trên điện thoại hoặc máy tính.";
            micBtn.disabled = true;
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'vi-VN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micBtn.addEventListener('click', () => {
                recognition.start();
                micBtn.classList.add('listening');
                statusText.innerText = "Đang nghe... (Hãy nói tên bài học)";
                resultBox.style.display = "none";
            });

            recognition.onresult = async (event) => {
                const userSpeech = event.results[0][0].transcript;
                statusText.innerText = `Đã nghe: "${userSpeech}". Đang tìm cách dạy...`;
                micBtn.classList.remove('listening');
                
                await fetchGeminiResponse(userSpeech);
            };

            recognition.onerror = (event) => {
                statusText.innerText = "Lỗi nhận diện giọng nói. Vui lòng thử lại.";
                micBtn.classList.remove('listening');
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        }

        async function fetchGeminiResponse(userInput) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: 'user', parts: [{ text: systemPrompt + "\n\nPhụ huynh nói: " + userInput }] }
                        ],
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 600
                        }
                    })
                });
                
                const data = await response.json();
                if (data.candidates && data.candidates.length > 0) {
                    const aiText = data.candidates[0].content.parts[0].text;
                    // Chuyển đổi định dạng in đậm và xuống dòng
                    const formattedText = aiText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
                    
                    resultBox.innerHTML = formattedText;
                    resultBox.style.display = "block";
                    statusText.innerText = "Chạm vào Micro để hỏi bài khác";
                } else {
                    statusText.innerText = "Có lỗi xảy ra từ AI. Vui lòng thử lại.";
                }
            } catch (error) {
                console.error('Error fetching Gemini:', error);
                statusText.innerText = "Lỗi kết nối. Vui lòng kiểm tra mạng.";
            }
        }
    </script>
</body>
</html>
